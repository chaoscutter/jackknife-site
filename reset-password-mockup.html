<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Jackknife — Reset Password (redesign mockup)</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet"/>
<style>
  :root{
    --primary:#00A385;
    --teal:#063340;
    --teal2:#0a3d4c;
    --ink:#111827;
    --muted:#6b7280;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased;}
  html,body{height:100%;}
  body{
    font-family:"Inter",system-ui,sans-serif;
    /* diagonal teal -> green glow, matching the app screen */
    background:
      radial-gradient(120% 90% at 90% 110%, rgba(0,163,133,.55) 0%, rgba(0,163,133,0) 55%),
      linear-gradient(165deg,#063340 0%,#0a3d4c 60%,#0d4a55 100%);
    min-height:100vh;
    display:flex;flex-direction:column;
    color:var(--ink);
  }

  /* status bar */
  .statusbar{display:flex;justify-content:space-between;align-items:center;
    padding:14px 26px 0;color:#0c2630;font-weight:700;font-size:17px;font-family:"Inter",sans-serif;}
  .statusbar .right{display:flex;gap:7px;align-items:center;font-size:14px;}

  /* back button — IMPROVEMENT 3: high-contrast, larger tap target */
  .back{
    margin:18px 0 0 22px;
    width:48px;height:48px;border-radius:50%;
    background:rgba(255,255,255,.92);
    box-shadow:0 4px 14px rgba(0,0,0,.18);
    display:flex;align-items:center;justify-content:center;
    border:none;cursor:pointer;
  }
  .back svg{width:22px;height:22px;stroke:var(--teal);stroke-width:2.5;fill:none;}

  .spacer{flex:1;}

  /* card */
  .card{
    background:#fff;
    border-radius:28px 28px 0 0;
    padding:30px 28px 30px;
    box-shadow:0 -10px 40px rgba(0,0,0,.18);
  }

  /* IMPROVEMENT 4: brand icon centered + larger */
  .brandmark{
    width:84px;height:84px;border-radius:22px;
    margin:0 auto 22px;
    background:radial-gradient(circle at 30% 25%,rgba(0,163,133,.16),rgba(0,163,133,.07));
    display:flex;align-items:center;justify-content:center;
  }
  .brandmark svg{width:46px;height:46px;}

  h1{
    font-family:"Montserrat",sans-serif;font-weight:800;
    font-size:30px;color:var(--teal);letter-spacing:-.5px;
    text-align:center;margin-bottom:22px;
  }

  /* confirmation block — IMPROVEMENT 1: email no longer clips, wraps cleanly */
  .confirm{
    background:#f0f8fa;border-radius:16px;padding:18px 18px;
    display:flex;gap:13px;align-items:flex-start;margin-bottom:24px;
  }
  .confirm .check{flex:0 0 auto;width:26px;height:26px;margin-top:2px;}
  .confirm p{font-size:16px;line-height:1.55;color:#374151;}
  .confirm .email{font-weight:700;color:var(--teal);
    overflow-wrap:anywhere;word-break:break-word;}

  .help{text-align:center;color:var(--muted);font-size:15px;line-height:1.5;
    padding:0 6px;margin-bottom:20px;}

  /* IMPROVEMENT 2: Resend is the primary action -> filled button */
  .btn-primary{
    display:block;width:100%;border:none;cursor:pointer;
    background:var(--primary);color:#fff;
    font-family:"Poppins",sans-serif;font-weight:600;font-size:17px;
    padding:17px;border-radius:14px;
    box-shadow:0 8px 20px rgba(0,163,133,.32);
    margin-bottom:18px;
  }

  .login{font-size:15px;color:#374151;}
  .login a{color:var(--teal);font-weight:600;text-decoration:underline;}
</style>
</head>
<body>
  <div class="statusbar">
    <span>5:16</span>
    <span class="right">▂▄▆ &nbsp; 🛜 &nbsp; <span style="border:1.5px solid #0c2630;border-radius:4px;padding:0 4px;font-size:11px;">100</span></span>
  </div>

  <!-- IMPROVEMENT 3 -->
  <button class="back" aria-label="Go back">
    <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>

  <div class="spacer"></div>

  <div class="card">
    <!-- IMPROVEMENT 4: centered, larger jackknife mark -->
    <div class="brandmark">
      <svg viewBox="0 0 24 24" fill="none">
        <path d="M3 7.5l9 5 9-5" stroke="#00A385" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M5.5 5.2l11 6.1a2 2 0 0 1 .9 2.4l-.7 1.9" stroke="#063340" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M18.5 5.2l-11 6.1a2 2 0 0 0-.9 2.4l.7 1.9" stroke="#063340" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M19.5 4l.5 1.6L21.6 6l-1.6.5L19.5 8l-.5-1.5L17.4 6l1.6-.4z" fill="#00A385"/>
      </svg>
    </div>

    <h1>Reset password</h1>

    <!-- IMPROVEMENT 1 -->
    <div class="confirm">
      <svg class="check" viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="12" r="10" stroke="#00A385" stroke-width="2"/>
        <path d="M7.5 12.5l3 3 6-6.5" stroke="#00A385" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <p>A password reset link has been sent to
        <span class="email">ryan.michael.mccarthy@gmail.com</span>.
        Check your inbox and follow the link to set a new password.</p>
    </div>

    <p class="help">Didn't get it? Check your spam folder, then resend.</p>

    <!-- IMPROVEMENT 2 -->
    <button class="btn-primary">Resend Email</button>

    <p class="login">Ready to log in? <a href="#">Back to Login</a></p>
  </div>
</body>
</html>
