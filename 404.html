<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Jackknife - Page Not Found</title>
<meta name="robots" content="noindex"/>
<!-- Firebase Hosting serves this file for any unmatched path, including deep
     ones like /a/b/c, so every asset and link here is root-absolute. A
     relative path would resolve against the missing page's directory.
     Styles are inline on purpose: this page must render even if a stylesheet
     is the thing that failed to load. -->
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Inter:wght@400;500&family=Poppins:wght@600&display=swap" rel="stylesheet"/>
<link rel="icon" href="/favicon.ico" sizes="any"/>
<link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32"/>
<link rel="apple-touch-icon" href="/apple-touch-icon.png"/>
<meta name="theme-color" content="#063340"/>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #ffffff;
    font-family: Inter, -apple-system, BlinkMacSystemFont, sans-serif;
    color: #063340;
  }
  .nf-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 28px 24px 0;
  }
  .nf-bar img { height: 40px; object-fit: contain; }
  .nf {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    min-height: 62vh;
    padding: 72px 24px 80px;
  }
  .nf-code {
    font-family: Montserrat, sans-serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #00a385;
    margin-bottom: 16px;
  }
  .nf h1 {
    font-family: Montserrat, sans-serif;
    font-size: clamp(30px, 5vw, 46px);
    font-weight: 800;
    line-height: 1.15;
    color: #063340;
    margin-bottom: 18px;
    text-wrap: balance;
  }
  .nf p {
    font-size: clamp(16px, 2vw, 19px);
    line-height: 1.6;
    color: #6b7c85;
    max-width: 460px;
    margin-bottom: 36px;
  }
  .nf-btn {
    display: inline-block;
    font-family: Poppins, sans-serif;
    font-size: 15px;
    font-weight: 600;
    color: #ffffff;
    background: #00a385;
    border-radius: 999px;
    padding: 14px 32px;
    text-decoration: none;
    transition: background 150ms ease;
  }
  .nf-btn:hover { background: #018a71; }
  .nf-btn:focus-visible { outline: 3px solid #063340; outline-offset: 3px; }
  .nf-links {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 12px 28px;
    margin-top: 40px;
  }
  .nf-links a {
    font-family: Poppins, sans-serif;
    font-size: 14px;
    font-weight: 600;
    color: #063340;
    text-decoration: none;
    opacity: 0.75;
    transition: opacity 150ms ease, color 150ms ease;
  }
  .nf-links a:hover { color: #00a385; opacity: 1; }
  .nf-links a:focus-visible { outline: 2px solid #00a385; outline-offset: 3px; border-radius: 2px; }
</style>
</head>
<body>

<div class="nf-bar">
  <a href="/index.html" aria-label="Jackknife home">
    <img src="/images/jk-logo.png" alt="Jackknife"/>
  </a>
</div>

<main class="nf">
  <p class="nf-code">Error 404</p>
  <h1>That page isn't here.</h1>
  <p>The link may be out of date, or we may have moved it. Your home record is untouched either way.</p>
  <a class="nf-btn" href="/index.html">Back to Home</a>
  <div class="nf-links">
    <a href="/features.html">Features</a>
    <a href="/faq.html">FAQ</a>
    <a href="/about.html">Our Story</a>
    <a href="/privacy.html">Privacy</a>
    <a href="/terms.html">Terms</a>
    <a href="mailto:info@jackknife.co">info@jackknife.co</a>
  </div>
</main>

</body>
</html>
